<!doctype html>
<html lang="fr">
  <head>
    <!-- Informations générales de la page et lien vers le fichier CSS.  -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ByteQuest, une application interactive pour réviser les bases de l'informatique."
    />
    <title>ByteQuest | Réviser l'informatique</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Conteneur principal de toute l'application. -->
    <div class="app">
      <!-- En-tête : nom de l'application et menu de navigation. -->
      <header class="topbar">
        <div>
          <p class="eyebrow">Mini-projet JavaScript &amp; DOM</p>
          <h1>ByteQuest</h1>
          <p class="intro">
            Révisez, convertissez et observez des algorithmes en action.
          </p>
        </div>

        <!-- Chaque bouton affiche un module grâce à son attribut data-module. -->
        <nav class="menu" aria-label="Navigation principale">
          <button
            class="nav-btn active"
            data-module="quiz"
            aria-controls="quiz"
          >
            Quiz
          </button>
          <button class="nav-btn" data-module="convert" aria-controls="convert">
            Convertisseur
          </button>
          <button
            class="nav-btn"
            data-module="flashcards"
            aria-controls="flashcards"
          >
            Flashcards
          </button>
          <button class="nav-btn" data-module="sort" aria-controls="sort">
            Tri
          </button>
        </nav>
      </header>

      <main>
        <!-- Module 1 : le quiz est visible au démarrage. -->
        <section id="quiz" class="module active" aria-labelledby="quiz-title">
          <h2 id="quiz-title">Quiz informatique</h2>
          <div id="quiz-content"></div>
          <p id="quiz-score">Score : 0 / 20</p>
        </section>

        <!-- Module 2 : conversion d'un nombre décimal. -->
        <section id="convert" class="module" aria-labelledby="convert-title">
          <h2 id="convert-title">Convertisseur</h2>
          <form class="converter-box" id="converter-form">
            <label for="decimal-input">Nombre décimal</label>
            <input
              type="number"
              id="decimal-input"
              min="0"
              placeholder="Ex. : 42"
            />
            <button id="convert-btn" type="submit">Convertir</button>
          </form>
          <div
            id="conversion-result"
            class="result-box"
            aria-live="polite"
          ></div>
        </section>

        <!-- Module 3 : cartes à retourner pour réviser. -->
        <section
          id="flashcards"
          class="module"
          aria-labelledby="flashcards-title"
        >
          <h2 id="flashcards-title">Flashcards</h2>
          <div id="cards-container" class="flashcards-box"></div>
          <button id="next-card">Carte suivante</button>
        </section>

        <!-- Module 4 : représentation visuelle du tri à bulles. -->
        <section id="sort" class="module" aria-labelledby="sort-title">
          <h2 id="sort-title">Tri à bulles</h2>
          <div class="sort-actions">
            <button id="reset-btn">Nouveau tableau</button>
            <button id="sort-btn">Lancer le tri</button>
          </div>
          <div
            id="bars-container"
            class="bars-container"
            aria-live="polite"
          ></div>
        </section>
      </main>
    </div>

    <!-- Le mot defer lance JavaScript après le chargement du HTML. -->
    <script src="script.js" defer></script>
  </body>
</html>
